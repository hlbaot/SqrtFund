name: CI/CD - Test, Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Không hủy giữa chừng một lần deploy production khi main có commit mới.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      RUN_VERIFICATION_INTEGRATION: '0'
      RUN_ROUND_RPC_INTEGRATION: '0'
      NEXT_PUBLIC_CHAIN_ID: '43113'
      NEXT_PUBLIC_RPC_URL: ${{ vars.NEXT_PUBLIC_RPC_URL || 'https://api.avax-test.network/ext/bc/C/rpc' }}
      NEXT_PUBLIC_RPC_URL_FALLBACK: ${{ vars.NEXT_PUBLIC_RPC_URL_FALLBACK }}
      NEXT_PUBLIC_EXPLORER_URL: ${{ vars.NEXT_PUBLIC_EXPLORER_URL || 'https://testnet.snowtrace.io' }}
      NEXT_PUBLIC_FACTORY_ADDRESS: ${{ vars.NEXT_PUBLIC_FACTORY_ADDRESS }}
      NEXT_PUBLIC_USDC_ADDRESS: ${{ vars.NEXT_PUBLIC_USDC_ADDRESS }}
      NEXT_PUBLIC_STUDENT_REGISTRY_ADDRESS: ${{ vars.NEXT_PUBLIC_STUDENT_REGISTRY_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        # Reads the pinned pnpm version from package.json.
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: Package build
        run: |
          test -s .next/BUILD_ID
          tar -czf sqrtfund-build.tar.gz --exclude='.next/cache' --exclude='.next/dev' \
            .next public package.json pnpm-lock.yaml pnpm-workspace.yaml \
            next.config.ts tsconfig.json scripts/bundle-stats.mjs
          sha256sum sqrtfund-build.tar.gz > SHA256SUMS
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqrtfund-build-${{ github.sha }}
          path: |
            sqrtfund-build.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  deploy:
    name: Deploy production to Vercel
    needs: [frontend, contracts, database]
    # PR chỉ chạy kiểm tra; chỉ main đã vượt qua cả ba job mới được deploy.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name. See docs/vercel-cd.md."
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@65.0.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pull Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel production output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt production output
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          if [[ ! "$deployment_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app/?$ ]]; then
            echo "::error::Vercel did not return a valid deployment URL."
            exit 1
          fi
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          printf '### Vercel production\n\n%s\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

  database:
    name: Database migrations and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sqrtfund_ci
          POSTGRES_PASSWORD: ci-fixture-only
        options: >-
          --health-cmd "pg_isready -U postgres -d sqrtfund_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply migrations to isolated fixture database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" mkdir -p /workspace
          docker cp supabase "$POSTGRES_CONTAINER:/workspace/supabase"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sqrtfund_ci -v ON_ERROR_STOP=1 -c \
            'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;'
          for migration in supabase/migrations/*.sql; do
            docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sqrtfund_ci -v ON_ERROR_STOP=1 -f "/workspace/$migration"
          done
      - name: Check OTP, identity, recovery and upload quota SQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for fixture in supabase/tests/*.sql; do
            docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sqrtfund_ci -v ON_ERROR_STOP=1 -f "/workspace/$fixture"
          done
      - name: Check competing organizer reviews
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 scripts/check-organizer-review-concurrency.py
      - name: Check concurrent upload quota reservations
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 scripts/check-upload-quota-concurrency.py

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Run contract tests and gas report
        run: forge test --gas-report | tee gas-report.txt
      - name: Save gas report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-gas-report-${{ github.sha }}
          path: contracts/gas-report.txt
          if-no-files-found: warn
          retention-days: 7
